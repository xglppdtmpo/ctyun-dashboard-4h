name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 质量闸门：语法检查 + 结构性回归测试。任一失败即终止，绝不构建/推送坏镜像。
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 移动公众协议侧车的运行时依赖：回归测试里有一批**真实拉起侧车**的断言，
      # 缺了这些包（曾经的 ModuleNotFoundError: No module named 'Crypto'）会让侧车级
      # 断言退化成"只验证未就绪"，闸门形同虚设 —— 与 Dockerfile 保持一致装齐。
      - name: Set up Python (sidecar runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sidecar dependencies
        run: pip install -r app/ecloud_engine/requirements.txt

      - name: Syntax check (node --check)
        run: node tests/syntax_check.js

      - name: Regression invariants
        run: node tests/regression.test.js

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. 登录 GitHub Packages (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 镜像目标：只推送到本仓库自己的 GHCR（不涉及任何外部账号）
      - name: Determine Docker images
        id: image-targets
        run: |
          echo "images=ghcr.io/${{ github.repository }}" >> $GITHUB_OUTPUT

      # 4. 提取镜像元数据与多架构标签
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image-targets.outputs.images }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=semver,pattern={{version}}

      # 5. 构建多架构镜像 (linux/amd64, linux/arm64) 并推送
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
